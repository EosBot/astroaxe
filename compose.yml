name: astroaxe

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:8.4.0-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [backend]
    security_opt: [no-new-privileges:true]

  migrate:
    build:
      context: .
      target: migrate-runner
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"
    security_opt: [no-new-privileges:true]

  app:
    build:
      context: .
      target: app-runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      GUEST_SESSION_SECRET: ${GUEST_SESSION_SECRET:?GUEST_SESSION_SECRET is required}
      FINGERPRINT_SECRET: ${FINGERPRINT_SECRET:?FINGERPRINT_SECRET is required}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:?NOMINATIM_USER_AGENT is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend, edge, egress]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${COMPOSE_PROJECT_NAME:-astroaxe}_edge"
      traefik.http.routers.astroaxe.rule: Host(`${ASTROAXE_HOST:-localhost}`)
      traefik.http.routers.astroaxe.entrypoints: web
      traefik.http.services.astroaxe.loadbalancer.server.port: "3000"
      traefik.http.services.astroaxe.loadbalancer.healthcheck.path: /api/health/ready
      traefik.http.services.astroaxe.loadbalancer.healthcheck.interval: 15s
    security_opt: [no-new-privileges:true]

  traefik:
    image: traefik:v3.7.0
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --accesslog=true
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [edge]
    security_opt: [no-new-privileges:true]

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    internal: true
  edge:
    internal: true
  egress:
