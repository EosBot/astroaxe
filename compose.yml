name: astroaxe

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:8.4.0-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [backend]
    security_opt: [no-new-privileges:true]

  migrate:
    build:
      context: .
      target: migrate-runner
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"
    security_opt: [no-new-privileges:true]

  app:
    build:
      context: .
      target: app-runner
      args:
        SITE_URL: ${SITE_URL:?SITE_URL is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      GUEST_SESSION_SECRET: ${GUEST_SESSION_SECRET:?GUEST_SESSION_SECRET is required}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?AUTH_SESSION_SECRET is required}
      FINGERPRINT_SECRET: ${FINGERPRINT_SECRET:?FINGERPRINT_SECRET is required}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:?NOMINATIM_USER_AGENT is required}
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Only `disabled` or `public` are valid here. This file intentionally declares no
      # archive root or derivative volume: selecting `local` from the public stack fails
      # startup instead of silently exposing the private corpus.
      CEREMONIAL_MODE: ${CEREMONIAL_MODE:-disabled}
      # Encrypts the plans and sessions a user writes in the planner — unrelated to the
      # private corpus, which is gated by CEREMONIAL_ARCHIVE_ROOT. Optional on purpose:
      # without it the planner answers 503 and stores nothing, instead of writing
      # personal records in the clear.
      CEREMONIAL_RECORD_KEYRING: ${CEREMONIAL_RECORD_KEYRING:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend, edge, egress]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${COMPOSE_PROJECT_NAME:-astroaxe}_edge"
      # `127.0.0.1` entra junto de propósito: o navegador no Windows resolve
      # `localhost` para IPv6 antes de IPv4, e o Traefik escuta só no laço IPv4.
      # Quando esse caminho falha, o que aparece é a última página em cache — o
      # que parece código velho no container e não é.
      traefik.http.routers.astroaxe.rule: Host(`${ASTROAXE_HOST:-localhost}`) || Host(`127.0.0.1`)
      traefik.http.routers.astroaxe.entrypoints: web
      traefik.http.services.astroaxe.loadbalancer.server.port: "3000"
      traefik.http.services.astroaxe.loadbalancer.healthcheck.path: /api/health/ready
      traefik.http.services.astroaxe.loadbalancer.healthcheck.interval: 15s
    security_opt: [no-new-privileges:true]

  worker:
    build:
      context: .
      target: worker-runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      GUEST_SESSION_SECRET: ${GUEST_SESSION_SECRET:?GUEST_SESSION_SECRET is required}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?AUTH_SESSION_SECRET is required}
      FINGERPRINT_SECRET: ${FINGERPRINT_SECRET:?FINGERPRINT_SECRET is required}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:?NOMINATIM_USER_AGENT is required}
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-nao-responda@astroaxe.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-AstroAxe}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    security_opt: [no-new-privileges:true]

  traefik:
    image: traefik:v3.7.0
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME:-astroaxe}`)
      - --entrypoints.web.address=:80
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addrouterslabels=true
      - --metrics.prometheus.addserviceslabels=true
      - --metrics.prometheus.buckets=0.05,0.1,0.25,0.5,0.75,1.0,2.5,5.0
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.defaultmode=drop
      - --accesslog.fields.names.StartUTC=keep
      - --accesslog.fields.names.Duration=keep
      - --accesslog.fields.names.RequestMethod=keep
      - --accesslog.fields.names.RouterName=keep
      - --accesslog.fields.names.ServiceName=keep
      - --accesslog.fields.names.OriginStatus=keep
      - --accesslog.fields.names.DownstreamStatus=keep
      - --accesslog.fields.names.RetryAttempts=keep
      - --accesslog.fields.headers.defaultmode=drop
    ports:
      - "${ASTROAXE_HTTP_BIND:-127.0.0.1}:${ASTROAXE_HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [edge, observability, public]
    security_opt: [no-new-privileges:true]

volumes:
  postgres_data:
    name: astroaxe_postgres18_data
  redis_data:

networks:
  backend:
    internal: true
  edge:
    internal: true
  egress:
  observability:
    internal: true
  public:
