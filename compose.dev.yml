services:
  app:
    build:
      context: .
      target: development
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next
    environment:
      NODE_ENV: development

volumes:
  dev_node_modules:
  dev_next:
