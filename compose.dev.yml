services:
  app:
    build:
      context: .
      target: development
    # The named volume survives image rebuilds. Keep it synchronized with the
    # authoritative lockfile before Turbopack starts so newly added packages
    # cannot be hidden by stale development dependencies.
    command: ["sh", "-c", "npm ci && exec npm run dev -- --hostname 0.0.0.0"]
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next
    environment:
      NODE_ENV: development
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  dev_node_modules:
  dev_next:
