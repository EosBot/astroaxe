sonar.projectKey=astroaxe
sonar.projectName=AstroAxe
sonar.sourceEncoding=UTF-8
sonar.working.directory=.scannerwork-user

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/**/__tests__/**/*
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/**/__tests__/**/*,src/generated/**/*

sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/generated/**/*,src/**/*.d.ts

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
