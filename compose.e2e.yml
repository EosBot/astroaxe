services:
  postgres:
    restart: "no"

  redis:
    restart: "no"

  app:
    restart: "no"
    networks: [backend, edge]
    labels: !override
      traefik.enable: "true"
      traefik.docker.network: "${COMPOSE_PROJECT_NAME:-astroaxe_e2e}_edge"
      traefik.http.routers.astroaxe-e2e.rule: Host(`${ASTROAXE_HOST:-127.0.0.1}`)
      traefik.http.routers.astroaxe-e2e.entrypoints: web
      traefik.http.services.astroaxe-e2e.loadbalancer.server.port: "3000"
      traefik.http.services.astroaxe-e2e.loadbalancer.healthcheck.path: /api/health/ready
      traefik.http.services.astroaxe-e2e.loadbalancer.healthcheck.interval: 15s

  worker:
    restart: "no"

  traefik:
    restart: "no"
    ports:
      - "${ASTROAXE_HTTP_BIND:-127.0.0.1}:${ASTROAXE_HTTP_PORT:-3100}:80"
    networks: [edge, e2e_public]

networks:
  e2e_public:

volumes:
  postgres_data:
    name: "${COMPOSE_PROJECT_NAME:-astroaxe_e2e}_postgres18_data"
